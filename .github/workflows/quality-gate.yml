
name: Quality Gate

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - 'package*.json'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-dist
          path: dist/
          retention-days: 5
